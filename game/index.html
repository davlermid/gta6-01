<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MONSOON ISLES</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Courier New', monospace; }
    #canvas { display: block; width: 100%; height: 100%; }
    #hud { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
    #minimap { position: absolute; bottom: 20px; right: 20px; width: 180px; height: 180px; background: rgba(0, 0, 0, 0.6); border: 2px solid #444; border-radius: 4px; }
    #bars { position: absolute; bottom: 20px; left: 20px; display: flex; flex-direction: column; gap: 6px; }
    .bar { width: 200px; height: 12px; background: rgba(0, 0, 0, 0.6); border: 1px solid #444; border-radius: 2px; overflow: hidden; }
    .bar-fill { height: 100%; transition: width 0.1s; }
    #health-bar .bar-fill { background: linear-gradient(90deg, #c00, #f40); }
    #stamina-bar .bar-fill { background: linear-gradient(90deg, #0a0, #4f0); }
    #stars { position: absolute; top: 20px; right: 20px; display: flex; gap: 4px; }
    .star { width: 24px; height: 24px; background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="%23444" d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>') center/contain no-repeat; opacity: 0.3; }
    .star.active { background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="%23ff0" d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>') center/contain no-repeat; opacity: 1; }
    #money { position: absolute; top: 20px; left: 20px; color: #0f0; font-size: 18px; font-weight: bold; text-shadow: 0 0 4px #000, 0 0 8px #0f0; }
    #mission-banner { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0, 0, 0, 0.85); border: 2px solid #444; padding: 20px 40px; text-align: center; display: none; z-index: 20; }
    #mission-banner h2 { color: #ff0; margin-bottom: 8px; font-size: 24px; }
    #mission-banner p { color: #ccc; font-size: 16px; }
    #title-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(180deg, #0a1a2a 0%, #000 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
    #title-screen h1 { font-size: 72px; color: #ff0; text-shadow: 0 0 20px #f80, 0 0 40px #f00; margin-bottom: 8px; letter-spacing: 8px; }
    #title-screen .subtitle { color: #888; font-size: 16px; margin-bottom: 40px; letter-spacing: 4px; }
    #title-screen .menu { display: flex; flex-direction: column; gap: 16px; }
    #title-screen button { background: rgba(255, 200, 0, 0.1); border: 2px solid #fa0; color: #ff0; padding: 16px 48px; font-size: 20px; cursor: pointer; transition: all 0.2s; letter-spacing: 2px; }
    #title-screen button:hover { background: #fa0; color: #000; box-shadow: 0 0 20px #fa0; }
    #controls-panel { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); color: #666; font-size: 13px; text-align: center; line-height: 1.8; }
    #pause-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 200; gap: 20px; }
    #pause-screen h2 { color: #ff0; font-size: 48px; }
    #pause-screen button { background: rgba(255, 200, 0, 0.1); border: 2px solid #fa0; color: #ff0; padding: 12px 32px; font-size: 18px; cursor: pointer; transition: all 0.2s; }
    #pause-screen button:hover { background: #fa0; color: #000; }
    .hidden { display: none !important; }
    @media (pointer: coarse) { #title-screen h1 { font-size: 48px; } }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="hud">
    <canvas id="minimap"></canvas>
    <div id="bars">
      <div id="health-bar" class="bar"><div class="bar-fill" style="width: 100%"></div></div>
      <div id="stamina-bar" class="bar"><div class="bar-fill" style="width: 100%"></div></div>
    </div>
    <div id="stars">
      <div class="star" data-star="1"></div>
      <div class="star" data-star="2"></div>
      <div class="star" data-star="3"></div>
      <div class="star" data-star="4"></div>
      <div class="star" data-star="5"></div>
    </div>
    <div id="money">$0</div>
    <div id="mission-banner">
      <h2></h2>
      <p></p>
    </div>
  </div>
  <div id="title-screen">
    <h1>MONSOON ISLES</h1>
    <div class="subtitle">A smuggler's archipelago</div>
    <div class="menu">
      <button id="btn-new">New Game</button>
      <button id="btn-continue" disabled>Continue</button>
    </div>
    <div id="controls-panel">
      WASD Move &bull; Shift Sprint &bull; Space Jump &bull; Mouse Look &bull; E Enter/Exit Vehicle &bull; Esc Pause
    </div>
  </div>
  <div id="pause-screen">
    <h2>PAUSED</h2>
    <button id="btn-resume">Resume</button>
    <button id="btn-quit">Quit to Title</button>
  </div>
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three.module.min.js"
    }
  }
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
